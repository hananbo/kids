name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan migrate --force --no-interaction
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Run CI Checks
        run: composer ci:check

      - name: Validate production security baseline
        env:
          APP_ENV: production
          APP_DEBUG: false
          APP_URL: https://app.example.invalid
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUDIT_LOG_KEY: ci-only-audit-integrity-key-with-at-least-32-characters
          SESSION_DRIVER: database
          SESSION_ENCRYPT: true
          SESSION_SECURE_COOKIE: true
          TRUSTED_HOSTS: ^app[.]example[.]invalid$
          TRUSTED_PROXIES: 10.0.0.0/8
          LOG_LEVEL: info
          LOG_STACK: stderr
          QUEUE_CONNECTION: database
        run: php artisan security:check --json

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Scan tracked files for common secret formats
        shell: bash
        run: |
          private_key_pattern='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE'
          private_key_pattern="${private_key_pattern} KEY-----"
          secret_pattern="(AKIA[0-9A-Z]{16}|${private_key_pattern}|sk_live_[0-9A-Za-z]{20,})"
          if git grep -nEI "${secret_pattern}" -- ':!package-lock.json'; then
            echo 'Potential secret detected in a tracked file.' >&2
            exit 1
          fi
